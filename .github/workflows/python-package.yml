name: build

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - name: Install lint dependencies
        run: uv sync --locked --group lint
      - name: Run pre-commit
        run: uv run --no-sync pre-commit run --all-files --show-diff-on-failure

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: uv sync --locked --group test
      - name: Run pytest
        run: uv run --no-sync pytest --cov --cov-report=xml
      - name: Run documentation examples
        shell: bash
        run: |
          for example in docs/examples/*.py; do
            uv run --no-sync python "$example"
          done
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.15'
        uses: codecov/codecov-action@v7
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: unittests
          fail_ci_if_error: false

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - name: Install documentation dependencies
        run: uv sync --locked --group docs
      - name: Build documentation
        run: uv run --no-sync mkdocs build --strict
