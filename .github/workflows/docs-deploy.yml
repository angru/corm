name: Deploy documentation

on:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'README.md'
      - 'CHANGELOG.md'

permissions:
  contents: write
  pages: write

concurrency:
  group: docs-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: Install documentation dependencies
        run: uv sync --locked --group docs
      - name: Deploy to gh-pages
        env:
          NO_MKDOCS_2_WARNING: "1"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          uv run --no-sync mkdocs gh-deploy --force --strict
      - name: Request a GitHub Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        # A branch push authenticated with GITHUB_TOKEN does not trigger Pages.
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
