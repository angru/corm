site_name: corm
theme:
  name: material

repo_name: angru/corm
repo_url: https://github.com/angru/corm

nav:
  - Overview: index.md
  - Usage:
      - usage/entity.md
      - usage/relationships.md
      - usage/key-relationships.md
      - usage/storage.md
  - To Be Done: to-be-done.md
  - FAQ: faq.md

markdown_extensions:
  - pymdownx.highlight
  - pymdownx.superfences
  - admonition
  - pymdownx.snippets:
      base_path: [docs]
      check_paths: true
